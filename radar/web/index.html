<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热度雷达</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --subtle:#f9fafb; --hover:#f2f4f7;
  --border:#e4e7ec; --border-strong:#d0d5dd; --divider:#f2f4f7;
  --text:#101828; --text-2:#475467; --muted:#98a2b3;
  --accent:#2563eb; --accent-hover:#1d4ed8; --accent-weak:#eff4ff;
  --hot:#d92d20; --hot-weak:#fef3f2; --warn:#dc6803; --warn-weak:#fffaeb; --ok:#039855; --ok-weak:#ecfdf3;
  --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.55 "Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);height:100vh}

/* 侧边栏 */
aside{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.brand .t{font-size:15px;font-weight:600;letter-spacing:.02em}
.brand .s{color:var(--muted);font-size:12px;margin-top:2px}
nav{padding:8px 10px;display:flex;flex-direction:column;gap:1px;overflow:auto}
.nav-group{color:var(--muted);font-size:11px;padding:14px 10px 4px;letter-spacing:.06em}
nav a{display:flex;align-items:center;justify-content:space-between;height:32px;padding:0 10px;border-radius:6px;color:var(--text-2);cursor:pointer;user-select:none}
nav a:hover{background:var(--hover);color:var(--text)}
nav a.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
nav a .c{font-size:12px;color:var(--muted);font-weight:400}
nav a.on .c{color:var(--accent)}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding:14px 16px 16px}
.side-foot .h{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.src{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);height:22px}
.src .r{margin-left:auto;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border-strong);flex:none}
.dot.ok{background:var(--ok)} .dot.err{background:var(--hot)}

/* 顶栏 */
main{overflow:auto;min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:rgba(245,246,248,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:18px;font-weight:600;margin:0;white-space:nowrap}
.topbar .desc{color:var(--text-2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;white-space:nowrap}
.content{padding:24px 32px 48px;max-width:1440px}

/* 按钮 */
.btn{height:32px;padding:0 14px;border:1px solid var(--border-strong);background:var(--surface);border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--subtle)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.danger{color:var(--hot)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--hover)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* 指标卡 */
.notice{background:var(--warn-weak);color:#93370d;border:1px solid #fedf89;border-radius:var(--radius);padding:9px 14px;margin-bottom:16px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px}
.kpi .l{color:var(--text-2);font-size:12px}
.kpi .v{font-size:26px;font-weight:600;line-height:1.3;margin-top:2px}
.kpi .v small{font-size:13px;font-weight:400;color:var(--muted)}
.kpi .h{color:var(--muted);font-size:12px}

/* 面板和表格 */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.panel + .panel,.grid2 + .panel,.panel + .grid2,.grid2 + .grid2{margin-top:16px}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel-h h2{font-size:14px;font-weight:600;margin:0}
.panel-h .sub{color:var(--muted);font-size:12px}
.panel-h .act{margin-left:auto;display:flex;align-items:center;gap:8px}
.pbody{padding:12px 16px}
.chartbox{width:100%}
.scroll-x{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--text-2);font-size:12px;text-align:left;padding:9px 16px;background:var(--subtle);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--divider);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
tr.click:hover td,.hl tbody tr:hover td{background:var(--subtle)}
th.r,td.r{text-align:right}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
th.sorted{color:var(--accent)}
td.nowrap{white-space:nowrap}
.dense td{padding:8px 14px}
.dense th{padding:8px 14px}
.heat-table{min-width:1000px;table-layout:fixed}
.heat-table th:nth-child(1){width:58px}
.heat-table th:nth-child(2){width:340px}
.heat-table th:nth-child(3){width:124px}
.heat-table th:nth-child(4){width:230px}
.heat-table th:nth-child(5){width:220px}
.heat-table th:nth-child(6){width:130px}
.heat-table th:nth-child(7){width:110px}
.heat-table td{vertical-align:top;overflow-wrap:anywhere}
[data-heatq]{max-width:100%}
.g-name{font-weight:600}
.g-alt{color:var(--muted);font-size:12px;margin-top:1px}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:24px;padding:0 8px;border-radius:12px;font-weight:600}
.score.s3{background:var(--hot-weak);color:var(--hot)}
.score.s2{background:var(--warn-weak);color:var(--warn)}
.score.s1{background:var(--hover);color:var(--text-2)}
.meter{display:flex;align-items:center;gap:8px;min-width:120px}
.meter .bar{flex:1;height:6px;background:#eef0f3;border-radius:3px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter .v{width:34px;text-align:right;color:var(--text-2);font-size:12px}
.tag{display:inline-block;padding:0 7px;line-height:20px;border-radius:4px;background:var(--hover);color:var(--text-2);font-size:11px;margin:3px 4px 0 0;white-space:nowrap}
.tag.hot{background:var(--hot-weak);color:var(--hot)}
.tag.blue{background:var(--accent-weak);color:var(--accent)}
.tag.solid{background:var(--hot);color:#fff}
.tag.ok{background:var(--ok-weak);color:var(--ok)}
.tag.warn{background:var(--warn-weak);color:var(--warn)}
.toolbar .seg{max-width:100%;overflow-x:auto}
.seg button{white-space:nowrap}
.quote{border-left:3px solid var(--border-strong);padding:4px 10px;margin:6px 0;color:var(--text-2);font-size:12px}
.subscores{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.subscores .bd .v{font-size:16px;margin:2px 0 0}
@media (max-width:960px){ .subscores{grid-template-columns:repeat(3,1fr)} }
td .tag{margin-top:0}
.up{color:var(--hot)} .down{color:var(--ok)} .muted{color:var(--muted)} .t2{color:var(--text-2)}
.empty{padding:56px 16px;text-align:center;color:var(--muted)}
.empty .t{color:var(--text-2);font-size:14px;font-weight:500;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:16px}
.grid2 .panel + .panel{margin-top:0}
.lnk{color:var(--text);font-weight:600;cursor:pointer;text-decoration:none;border-bottom:1px dashed var(--border-strong)}
.lnk:hover{color:var(--accent);border-bottom-color:var(--accent)}
a.ext{color:var(--accent);text-decoration:none;font-size:12px}
a.ext:hover{text-decoration:underline}
.medal{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:600}
.medal.m1{background:#fef0c7;color:#93370d}
.medal.m2{background:#eaecf0;color:#344054}
.medal.m3{background:#ffead5;color:#9c2a10}
select.sel,input.search{height:28px;border:1px solid var(--border-strong);border-radius:6px;padding:0 10px;background:var(--surface);font-size:12px}
input.search{width:220px}
select.sel:focus,input.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.toolbar .info{color:var(--text-2);font-size:12px}
.toolbar .right{margin-left:auto;display:flex;gap:8px}
.note2{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--radius);padding:12px 16px;color:var(--text-2);font-size:12px;line-height:1.85;margin-top:16px}
.note2 b{color:var(--text)}
.note2 ol{margin:4px 0;padding-left:18px}

/* 详情抽屉 */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.28);opacity:0;pointer-events:none;transition:opacity .16s;z-index:20}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:-12px 0 32px rgba(16,24,40,.08);transform:translateX(100%);transition:transform .2s ease;z-index:21;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:14px}
.dh img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--hover);flex:none}
.dh img.wide{width:120px;height:56px;border-radius:6px}
.dh .n{font-size:17px;font-weight:600;line-height:1.35}
.dh .close{margin-left:auto}
.db{padding:0 24px 40px;overflow:auto}
.sec{padding:20px 0;border-bottom:1px solid var(--divider)}
.sec:last-child{border-bottom:none}
.sec h3{font-size:13px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sec h3 .sub{font-weight:400;color:var(--muted);font-size:12px}
.final{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.final .v{font-size:32px;font-weight:600;line-height:1}
.final .l{color:var(--text-2);font-size:12px}
.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.breakdown.b4{grid-template-columns:repeat(4,1fr)}
.bd{border:1px solid var(--border);border-radius:6px;padding:10px 12px}
.bd .l{font-size:12px;color:var(--text-2)}
.bd .v{font-size:18px;font-weight:600;margin:2px 0 6px}
.why{font-size:12px;color:var(--text-2);margin-top:10px}
.mini{border:1px solid var(--border);border-radius:6px;overflow:hidden}
.mini th,.mini td{padding:7px 10px;font-size:12px}
.target{margin-bottom:14px}
.target .h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.target .h b{font-weight:600}
.chart{margin-bottom:14px}
.chart .l{font-size:12px;color:var(--text-2);display:flex;justify-content:space-between;margin-bottom:4px}
.chart .chartbox{border:1px solid var(--divider);border-radius:6px;background:var(--subtle)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden}
.seg button{border:none;background:var(--surface);min-width:40px;height:30px;padding:0 12px;cursor:pointer;border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--subtle)}
.seg button.on{background:var(--accent);color:#fff}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:4px}
.field input{width:100%;height:34px;border:1px solid var(--border-strong);border-radius:6px;padding:0 10px;background:var(--surface)}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.field .hint{font-size:12px;color:var(--muted);margin-top:3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.veto{background:var(--hot-weak);color:#912018;border-radius:6px;padding:9px 12px;font-size:12px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:12px}
.kv .k{color:var(--muted)}
.live{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:12px;min-width:0;max-width:520px}
.live .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--border-strong);flex:none}
.pulse.on{background:var(--ok);animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(3,152,85,.45)}70%{box-shadow:0 0 0 7px rgba(3,152,85,0)}100%{box-shadow:0 0 0 0 rgba(3,152,85,0)}}
.prog{height:4px;background:#eef0f3;border-radius:2px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--ok);transition:width .4s}
.nowcard{display:flex;align-items:center;gap:14px}
.nowcard .big{font-size:15px;font-weight:600}
.term{background:#0c111d;color:#d0d5dd;font:12px/1.65 Consolas,"Cascadia Mono","Courier New",monospace;padding:12px 16px;height:420px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.term .e{color:#f97066} .term .g{color:#6ce9a6} .term .m{color:#667085}
.banner{background:var(--accent-weak);color:#1e40af;border:1px solid #c7d7fe;border-radius:var(--radius);padding:10px 14px;margin-bottom:16px;font-size:12px;display:flex;align-items:center;gap:12px}
.banner a{color:var(--accent);font-weight:600;cursor:pointer;margin-left:auto;white-space:nowrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:9px 16px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
.toast.on{opacity:1}
.chart-msg{display:flex;align-items:center;justify-content:center;height:100%;min-height:120px;color:var(--muted);font-size:12px;text-align:center;padding:16px}

/* 各平台：左边平台目录，右边选中平台 */
.pl{display:grid;grid-template-columns:248px minmax(0,1fr);gap:20px;align-items:start}
.pl-main{min-width:0}
.growth-table{min-width:850px}
.growth-table td:nth-child(2){min-width:180px;max-width:260px}
.growth-table td:nth-child(n+3){white-space:nowrap}
.raw-table td:first-child{min-width:180px}
.raw-table td:nth-child(n+2){white-space:nowrap}
.bili-growth-table{min-width:1050px;table-layout:fixed}
.bili-growth-table th:first-child{width:290px}
.bili-growth-table td:first-child{overflow-wrap:anywhere}
.bili-growth-table details{font-weight:400}
.bili-growth-table summary{cursor:pointer;font-weight:600}
.bili-growth-evidence{padding-top:8px;font-size:12px}
.bili-growth-edge{border-top:1px solid var(--divider);padding:6px 0;line-height:1.7}
.bili-growth-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bili-growth-controls input{max-width:100%;min-width:0}
.pd{position:sticky;top:76px;max-height:calc(100vh - 100px);overflow-y:auto;padding:6px 0}
.pd-g{padding:4px 8px 8px}
.pd-g + .pd-g{border-top:1px solid var(--divider);padding-top:8px}
.pd-h{display:flex;justify-content:space-between;align-items:baseline;padding:6px 8px 4px;font-size:12px;font-weight:600;color:var(--text)}
.pd-h .num{font-weight:400;font-size:11px;color:var(--muted)}
.pd-i{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;color:var(--text-2);cursor:pointer;user-select:none;font-size:12.5px}
.pd-i:hover{background:var(--hover);color:var(--text)}
.pd-i.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.pd-i .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd-i .r{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400;white-space:nowrap}
.pd-i.off .n{color:var(--muted)}
.pd-i.on.off .n{color:var(--accent)}
.dot.todo{background:transparent;border:1px solid var(--border-strong)}
.dot.wait{background:var(--border-strong)}
.pd-sel{display:none;width:100%;height:34px;margin-bottom:12px}
.ph{margin-bottom:14px}
.ph-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph-t h2{font-size:18px;font-weight:600;margin:0}
.ph-t .tag{margin:0}
.ph-g{color:var(--muted);font-size:12px}
.ph-d{color:var(--text-2);font-size:12px;margin-top:4px}
.ph-m{color:var(--muted);margin-left:10px;white-space:nowrap}
.todo .kv{grid-template-columns:96px 1fr;font-size:13px;gap:10px 16px}
/* 视频平台大厅（抖音 / 快手 / 小红书 / TikTok / 指数） */
.pd-h.hub{cursor:pointer;border-radius:6px}
.pd-h.hub{width:100%;border:0;background:transparent;text-align:left;font-family:inherit}
.pd-h.hub:hover,.pd-h.hub.on{background:var(--accent-weak);color:var(--accent)}
.platform-status{margin-bottom:22px}
.platform-status-head{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.platform-status-head h3{font-size:14px;font-weight:600;margin:0}
.platform-status-head span{font-size:12px;color:var(--muted)}
.platform-status-table{min-width:760px;table-layout:fixed}
.platform-status-table th:nth-child(1){width:125px}
.platform-status-table th:nth-child(2){width:82px}
.platform-status-table th:nth-child(3){width:115px}
.platform-status-table th:nth-child(4),.platform-status-table th:nth-child(5){width:110px}
.platform-status-table td{vertical-align:top;overflow-wrap:anywhere}
.platform-status-table .platform-status-note{font-size:12px;color:var(--text-2);line-height:1.6}
.soc-jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.soc-job{border:1px solid var(--border);border-radius:6px;padding:8px 10px;background:var(--subtle);font-size:12px}
.soc-job b{font-size:12.5px;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.soc-term{font-weight:600;cursor:pointer}
.soc-term:hover{color:var(--accent)}
.soc-err{color:var(--hot)}

@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr);height:auto}
  aside{border-right:none;border-bottom:1px solid var(--border)}
  .brand{padding:14px 16px}
  nav{flex-direction:row;overflow-x:auto;padding:6px 8px}
  nav a{white-space:nowrap;gap:6px}
  .nav-group,.side-foot{display:none}
  .topbar,.content{padding-left:16px;padding-right:16px}
  .topbar .desc{display:none}
  .topbar .right{min-width:0}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  .breakdown.b4{grid-template-columns:repeat(2,1fr)}
  .hide-sm{display:none}
  input.search{width:150px}
  .pl{grid-template-columns:1fr;gap:0}
  .pd{display:none}
  .pd-sel{display:block}
  .ph-m{display:block;margin-left:0}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="t">热度雷达</div><div class="s">Fast Follow 机会发现</div></div>
    <nav id="nav"></nav>
    <div class="side-foot"><div class="h">数据源</div><div id="srcs"></div></div>
  </aside>
  <main>
    <div class="topbar">
      <h1 id="title">机会</h1>
      <span class="desc" id="desc"></span>
      <div class="right"><div class="live" id="live"><span class="pulse" id="pulse"></span><span class="txt" id="liveText">连接中</span></div><span id="updated" class="num hide-sm"></span><button class="btn primary" id="refresh">立即刷新数据</button></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="mask" id="mask"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script>

function itemState(it){
  if(it.soc) return socState(it.soc);
  if(it.src==="steam"){
    const p=S.steam_priority||{}, results=(p.results||[]).filter(r=>r.metrics?.players!=null);
    if((results.length || p.running) && !p.stale){
      const stamp=results.length?Math.max(...results.map(r=>r.ts)):p.ts;
      const progress=p.phase==="discovery"?"正在扫描近15天发行游戏":`本轮在线采样 ${p.completed??results.length} / ${p.total??"?"} 款`;
      return {k:"ok",t:ago(stamp),v:{ok_ts:stamp,sample_progress:progress,error:"",
        warn:p.errors?.length?`${p.errors.length} 项采样异常`:""}};
    }
  }
  if(it.src==="bvideo"){
    const h=S.video_hotspots||{}, c=h.collection||{}, status=h.status||"未采集";
    if(h.stream?.enabled){
      const s=h.stream, r=s.latest?.received?s.latest:(s.round||{});
      const stamp=r.received||r.finished, failed=["paused","error","partial","gap","stale"].includes(s.status);
      return {k:failed?"err":(stamp?"ok":"wait"),t:BILI_STREAM_STATES[s.status]||s.status,
        v:{count:r.new??r.new_sightings??0,ok_ts:r.received||(!failed?stamp:null),
          err_ts:failed?(r.last_attempt||stamp):null,
          error:r.error||(s.status==="gap"?"前后批次未衔接":s.status==="stale"?"最新投稿时间落后":""),warn:""}};
    }
    if(h.daily){
      const d=h.daily, failed=["error","paused","waiting_index","partial"].includes(d.status);
      return {k:failed?"err":(d.status==="complete"?"ok":"wait"),t:BILI_DAILY_STATES[d.status]||d.status,
        v:{count:d.videos||0,ok_ts:d.status==="complete"?d.updated:null,
          err_ts:failed?d.updated:null,error:biliDailyError(d),warn:""}};
    }
    return {k:c.failed?"err":(status==="已采样"?"ok":"wait"),t:status,
      v:{ok_ts:c.count?c.ts:null,err_ts:c.failed?c.ts:null,count:c.count,
         error:c.failed?(c.errors||[]).join("；"):"",
         warn:c.failed?"":(c.errors||[]).slice(0,3).join("；")}};
  }
  const v = it.src ? (S.sources||{})[it.src] : null;
  if(it.src && v && v.ok_ts && sourceState(v)!=="err") return {k:"ok", t:ago(v.ok_ts), v};

/* ---------- 工具 ---------- */
function fmt(v){ if(v==null||v==="") return "-"; v=+v; const a=Math.abs(v); if(a>=1e8) return (v/1e8).toFixed(1)+"亿"; if(a>=1e4) return (v/1e4).toFixed(1)+"万"; return Math.round(v).toLocaleString(); }
function wan(v){ return v==null?"-":(v/1e4).toFixed(2); }
function pct(g){ if(g==null) return "-"; const p=(Math.exp(g)-1)*100; return (p>0?"+":"")+(Math.abs(p)>=100?p.toFixed(0):p.toFixed(1))+"%"; }
function pcls(g){ return g==null?"muted":(g>0.01?"up":(g<-0.01?"down":"t2")); }
function chg(a,b){ if(!b) return "-"; const p=(a/b-1)*100; return (p>0?"+":"")+p.toFixed(1)+"%"; }
function ago(ts){ if(!ts) return "-"; const s=Date.now()/1000-ts; if(s<60) return "刚刚"; if(s<3600) return Math.round(s/60)+" 分钟前"; if(s<86400) return Math.round(s/3600)+" 小时前"; return Math.round(s/86400)+" 天前"; }
function pad(n){ return String(n).padStart(2,"0"); }
function ymd(ts){ if(!ts) return "-"; const d=new Date(ts*1000); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function md(ts){ const d=new Date(ts*1000); return pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function dtm(ts){ const d=new Date(ts*1000); return md(ts)+" "+pad(d.getHours())+":"+pad(d.getMinutes()); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function mkName(k){ return (S.config?.markets||{})[k]||k||"-"; }
function tgName(k){ return (S.config?.targets||{})[k]||k||"-"; }
function scoreCls(v){ return v!=null&&v>0?"s3":"s1"; }
function fmtZ(v){ return v==null?"-":(+v).toFixed(2); }
function meter(v){ v=Math.max(0,Math.min(1,+v||0)); return `<div class="meter"><div class="bar"><i style="width:${Math.round(v*100)}%"></i></div><span class="v num">${v.toFixed(2)}</span></div>`; }
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("on"); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove("on"),2000); }

function dailyNew(pts){ const m=new Map(); for(const [t,v] of pts) m.set(ymd(t), v); const a=[...m.entries()], out=[]; for(let i=1;i<a.length;i++) out.push([a[i][0], Math.max(0, a[i][1]-a[i-1][1])]); return out; }

/* ---------- 图表组件（ECharts，Apache-2.0 开源，首次运行自动下载到本地） ---------- */
let EC_LOADING = null, EC_FAILED = false;
function loadEcharts(){
  if(window.echarts) return Promise.resolve(true);
  if(EC_LOADING) return EC_LOADING;
  EC_LOADING = new Promise(res=>{ const s=document.createElement("script"); s.src="/vendor/echarts.min.js"; s.onload=()=>{EC_FAILED=false; res(true);}; s.onerror=()=>{ EC_LOADING=null; EC_FAILED=true; s.remove(); res(false); }; document.head.appendChild(s); });
  return EC_LOADING;
}
function chartFail(){ document.querySelectorAll(".chartbox").forEach(el=>{ if(!el.firstChild) el.innerHTML=`<div class="chart-msg">图表组件下载失败（第一次使用需要联网下载约 1MB）。<br>检查网络，或在 radar_data/settings.json 里填代理后重开程序。</div>`; }); }
function withCharts(fn){ if(window.echarts){ try{ fn(); }catch(e){ console.error(e); } return; } loadEcharts().then(ok=>{ if(ok){ try{ fn(); }catch(e){ console.error(e); } } else chartFail(); }); }
function mountChart(id, opt){
  const el = $(id); if(!el || !window.echarts) return null;
  let c = echarts.getInstanceByDom(el); if(!c) c = echarts.init(el);
  c.setOption(Object.assign({color:PALETTE, animationDuration:300, textStyle:{fontFamily:'"Segoe UI","Microsoft YaHei UI","PingFang SC",sans-serif'}}, opt), true);
  CHARTS[id] = c; return c;
}
function disposeIn(root){ for(const [id,c] of Object.entries(CHARTS)){ const d=c.getDom(); if(!d || !d.isConnected || (root && root.contains(d))){ try{ c.dispose(); }catch(e){} delete CHARTS[id]; } } }
window.addEventListener("resize", ()=>{ for(const c of Object.values(CHARTS)){ try{ c.resize(); }catch(e){} } });

function counts(){ return {heat:HEAT.loaded?heatRows("all","").length:null}; }
function sourceState(v){ if(v.state) return v.state; const err = v.error && (!v.ok_ts || (v.err_ts||0) >= v.ok_ts); return err?"err":(v.ok_ts?"ok":""); }
function sourceRows(){

  return Object.entries(src);
}
function render(){
  const c = counts();

function socJobErr(j){ return j.last_ok===false || (j.error && (!j.ok_ts || (j.err_ts||0) >= j.ok_ts)); }
function socState(key){
  const d = SOC.data, it = SOC_ITEMS[key];
  if(!d){ if(!SOC.ts) loadSoc(); return {k:"wait", t:SOC.ts?"读不到":"读取中"}; }
  if(!d.enabled) return {k:"todo", t:"已关", todo:{why:"settings.json 里 SOCIAL_ENABLED 是 false", need:"改成 true 后重开雷达"}};
  const all = d.jobs.filter(j=>it.jobs.includes(j.job));
  const js = all.filter(j=>j.on && j.ready);
  if(!js.length) return {k:"todo", t:all.some(j=>!j.on)?"已关":"待验证",
    todo:{why:all.find(j=>j.ready_reason)?.ready_reason||"尚无通过来源校验的采集入口",need:""}};
  const ok = js.filter(j=>j.ok_ts && !socJobErr(j)), bad = js.filter(socJobErr);
  const v = {ok_ts: ok.length ? Math.max(...ok.map(j=>j.ok_ts)) : null,
             err_ts: bad.length ? Math.max(...bad.map(j=>j.err_ts||0)) : null,
             error: bad.map(j=>j.name+"："+j.error).join("；")};
  if(ok.length && !bad.length) return {k:"ok", t:ago(v.ok_ts), v};
  if(ok.length) return {k:"err", t:"部分失败", v:{ok_ts:v.ok_ts,err_ts:v.err_ts,error:v.error}};
  if(bad.length) return {k:"err", t:"失败", v};

}

async function socOpen(term){
  SOC.term = term; SOC.termData = null;
  SOC.termGroup=PLAT.src==="hub:index"||SOC_ITEMS[PLAT.src.slice(4)]?.group==="index"?"index":"video";
  PLAT.src="hub:"+SOC.termGroup; contentPage=null;
  renderContent(); const m=document.querySelector("main"); if(m) m.scrollTop = 0;

  SOC.termData = d?.validation_version===1

async function socPost(u, b){ try{ const r = await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})}); return await r.json(); }catch(e){ return {ok:false, note:String(e)}; } }
document.addEventListener("click", async e=>{
  const t = e.target.closest && e.target.closest("[data-socact],[data-soclab],[data-socb],[data-soch],[data-socopen],[data-socunwatch]");
  if(!t) return;
  e.preventDefault();
  const ds = t.dataset;
  if(ds.socb){ SOC.b = ds.socb; renderContent(); return; }
  if(ds.soch){ SOC.h = ds.soch; renderContent(); return; }
  if(ds.socopen){ socOpen(ds.socopen); return; }
  if(ds.soclab!==undefined){ t.disabled = true; await socPost("/api/social/label",{term:ds.socterm, label:ds.soclab}); await loadSoc(true); return; }
  if(ds.socunwatch){ await socPost("/api/social/watch",{term:ds.socunwatch, add:false}); await loadSoc(true); return; }
  const a = ds.socact;
  if(a==="closeterm"){ SOC.term = null; SOC.termData = null; renderContent(); }
  else if(a==="run"){ const r = await socPost("/api/social/run"); toast(r.note||"好了"); setTimeout(()=>loadSoc(true), 5000); }
  else if(a==="open"){ t.disabled = true; const r = await socPost("/api/social/open",{url:ds.url}); t.disabled = false; toast(r.note||""); }
  else if(a==="browser"){ t.disabled = true; const r = await socPost("/api/social/browser"); t.disabled = false; toast(r.note||r.error||""); setTimeout(()=>loadSoc(true), 3000); }
  else if(a==="watchadd"){ const el = $("socWatchIn"), v = el ? el.value.trim() : ""; if(!v) return; await socPost("/api/social/watch",{term:v, add:true}); await loadSoc(true); }
});

  const how = h.approx

function mountHist(c){

function loadHeat(force=false){
  if(HEAT.loading) return HEAT.loading;
  if(!force && HEAT.loaded && Date.now()-HEAT.loaded<60000) return Promise.resolve();
  HEAT.loading=(async()=>{
    const [data,matches]=await Promise.all([
      getJSON("/api/bili-growth"),getJSON("/api/bili-terms?matched=1")]);
    if(data && Array.isArray(data.groups)){
      HEAT.data.bvideo=data;
      delete HEAT.failed.bvideo;
    }else HEAT.failed.bvideo="视频指数读取失败，保留上次数据";
    if(matches && Array.isArray(matches.rows)){
      HEAT.matches=matches.rows;
      delete HEAT.failed.matches;
    }else HEAT.failed.matches="关键词关联读取失败，保留已有游戏档案";
    HEAT.loaded=Date.now();
    if(page==="heat") render();
    // Store snapshots are reference columns only; never inputs to video ranking.
    const sources=new Set();
    for(const row of heatRows("all","")){
      if(row.card) continue;
      for(const member of heatMembers(row)){
        const source=member.split(":")[0];
        if(source && source!=="btopic" && source!=="bvideo") sources.add(source);
      }
    }
    const queue=[...sources];
    async function worker(){
      while(queue.length){
        const source=queue.shift();
        const data=await getJSON("/api/raw?source="+encodeURIComponent(source));
        if(data && Array.isArray(data.rows)){
          HEAT.references[source]=Object.fromEntries(data.rows.map(r=>[r.key,r]));
          delete HEAT.failed["reference:"+source];
        }else HEAT.failed["reference:"+source]="商店参考数据读取失败";
      }
    }
    await Promise.all([worker(),worker(),worker()]);
    if(force || Date.now()-HEAT.historyLoaded>600000) await loadHeatHistory();
  })().finally(()=>{
    HEAT.loading=null;
    if(page==="heat") render();
  });
  return HEAT.loading;
}

function heatDay(offset=0){

    (!data.baseline_started || !data.updated || data.updated>=data.baseline_started);

function heatCard(row){

  if(!valid.length) return null;

  return 1+valid.reduce((total,c)=>{

async function loadHeatHistory(){
  const data=HEAT.data.bvideo;
  if(!data?.day) return;
  const config=videoHeatConfig(), queue=[];
  const activeBaseline=data.baseline_started||0;
  for(let offset=0;offset<config.historyDays;offset++){
    const day=heatDay(offset+1);
    if(Date.parse(day+"T00:00:00+08:00")/1000+86400<=activeBaseline) continue;
    if(day===data.day){HEAT.history["bvideo:"+day]=data;continue;}
    queue.push(day);
  }
  async function worker(){

      const day=queue.shift(), value=await getJSON("/api/bili-growth?day="+day);

      }else HEAT.failed["history:"+day]="历史视频指数读取失败";

      (data.baseline_started||0)!==(HEAT.data.bvideo?.baseline_started||0)) continue;
    const matches=(data.groups||[]).filter(g=>{
      if(g.archive?.gid && row.archive?.gid) return g.archive.gid===row.archive.gid;
      return heatNames(g).some(name=>names.has(heatKey(name)));
    });
    const indexes=matches.map(g=>g.index).filter(Number.isFinite);
    if(indexes.length) days.set(data.day,Math.max(days.get(data.day)||0,...indexes));

function heatRows(source=HEAT.source, query=HEAT.q){
  const q=query.trim().toLowerCase(), games=new Map();
  const cards=allCards(), byGid=new Map(cards.map(c=>[c.gid,c]));
  const byMember=new Map(cards.flatMap(c=>(c.members||[]).map(m=>[m,c])));
  const visible=c=>!c?.label?.blocked && !c?.label?.dismissed;
  function add(group,src){
    const card=byGid.get(group.archive?.gid)||byMember.get(group.archive?.member);
    if(card&&!visible(card)) return null;
    const archive=card?{gid:card.gid,member:group.archive?.member||card.members?.[0]}:group.archive;
    const key=heatIdentity({...group,archive},src);
    if(!games.has(key)) games.set(key,{...group,key,archive,card,aliases:[],
      contributions:[],evidence:[],matches:[]});
    const row=games.get(key);
    row.aliases=[...new Set([...heatNames(row),...heatNames(group),
      card?.name_en,card?.name_cn,...(card?.label?.aliases||[])].filter(Boolean))]
      .filter(n=>n!==row.name);
    return row;
  }
  // Game identity and presentation survive missing or reset trend windows.
  for(const card of S.cards||[]){
    if(visible(card)) add({name:card.name,archive:{gid:card.gid,member:card.members?.[0]}},"bvideo");
  }
  for(const term of HEAT.matches||[]){
    if(!term.archive?.gid || !(term.seed_videos>0)) continue;
    const row=add(term,"bvideo");
    if(row) row.matches.push(term);
  }
  for(const [src,data] of Object.entries(HEAT.data)){
    if(!Object.hasOwn(VIDEO_HEAT_NAMES,src)) continue;
    for(const group of data.groups||[]){
      const row=add(group,src);
      if(!row) continue;
      row.evidence.push({source:src,group});
      const index=heatFresh(data)&&Number.isFinite(group.index)&&group.index>=0?group.index:null;
      const contribution={source:src,index,day:data.day,group,stale:!heatFresh(data)};
      const old=row.contributions.findIndex(c=>c.source===src);
      // Multiple alias groups for one game are not independent platform signals.
      if(old<0) row.contributions.push(contribution);
      else if(index!=null&&(row.contributions[old].index==null||index>row.contributions[old].index))
        row.contributions[old]=contribution;
    }
  }
  const rows=[...games.values()].map(row=>{
    const observations=(row.card?.heat?.videos||[]).filter(v=>Number.isFinite(v.recent??v.value));
    // An observed video rate is a provisional ordering only, never a growth ratio.
    const observed=observations.reduce((total,v)=>total+Math.max(0,v.recent??v.value),0);
    return {...row,observations,observed,index:heatIndex(row.contributions)};
  });
  rows.sort((a,b)=>(a.index==null)-(b.index==null)||(b.index??0)-(a.index??0)||
    (a.index==null?b.observed-a.observed:0)||
    a.name.localeCompare(b.name)||a.key.localeCompare(b.key));
  let rank=0,position=0;
  for(const row of rows){
    row.position=++position;
    row.rank=row.index==null?null:++rank;
  }
  return rows.filter(r=>(source==="all"||r.contributions.some(c=>c.source===source))&&(!q||
    [...heatNames(r),...heatMembers(r),r.card?.label?.note,...(r.card?.devs||[])]
      .some(n=>String(n||"").toLowerCase().includes(q))));
}
function heatChange(item){
  const states={pending:"待首次采样",baseline:"待可比基线",stale:"采样过期",
    reset:"累计值回退，待核验",unverified:"历史零值待核验"};
  if(!["measured","published"].includes(item.state)) return `<span class="muted">${states[item.state]||"-"}</span>`;
  const change=item.rank?rankChange(item.delta):`${item.delta>0?"+":""}${fmt(item.delta)}`;
  return `<span class="num ${item.delta>0?"up":item.delta<0?"down":""}">${change}</span><div class="g-alt">${item.state==="published"?"平台公布变化":item.hours.toFixed(1)+" 小时观测"}</div>`;
}

function scaleValues(c){

/* ---------- 按天汇总（v51：单个游戏只看天，不看小时） ---------- */
// 累计数（评论、下载、访问）换算成每天新增；“现在有多少人”的数（在线、观看、直播热度）取每天最高和全天平均；名次取每天最好的一次
const CUM_MET = new Set(["reviews","reviews_cn","downloads","reserves","fans","visits","views"]);
const MET_ORDER = ["players","peak_daily","viewers","heat","rooms","downloads","reviews","visits","fans","reserves","videos","views"];
const DAY_HIDE = new Set(["reviews_cn"]);
const DAY_NOTE = "在线、观看、直播热度取每天最高那次和全天平均；评论、下载、访问这类累计数换算成每天新增；名次取每天最好的一次";
function metKind(m){ return isRank(m) ? "rank" : (CUM_MET.has(m) ? "cum" : "level"); }
function sortMets(ms){ const o = m => { const i = MET_ORDER.indexOf(m); return i>=0 ? i : (isRank(m) ? 50 : 60); }; return ms.slice().sort((a,b)=>o(a)-o(b) || a.localeCompare(b)); }
function byDay(pts, kind){
  const m = new Map();
  for(const [t,v] of pts||[]){ if(v==null) continue; const d = ymd(t); let o = m.get(d);
    if(!o){ o = {d, n:0, sum:0, max:-Infinity, min:Infinity, last:null}; m.set(d, o); }
    o.n++; o.sum += v; if(v>o.max) o.max = v; if(v<o.min) o.min = v; o.last = v; }
  const days = [...m.values()], today = ymd(Date.now()/1000);
  if(kind==="cum"){
    const out = [];
    for(let i=1;i<days.length;i++){
      const gap = Math.max(1, Math.round((new Date(days[i].d) - new Date(days[i-1].d))/864e5));
      out.push({d:days[i].d, v:Math.max(0, days[i].last - days[i-1].last)/gap, gap, total:days[i].last, partial:days[i].d===today});
    }
    return out;
  }
  if(kind==="rank") return days.map(o=>({d:o.d, v:o.min, n:o.n, partial:o.d===today}));
  return days.map(o=>({d:o.d, v:o.max, avg:o.sum/o.n, n:o.n, partial:o.d===today}));
}
function dayLabel(m, src, kind){
  const n = metName(m, src).replace(/^累计/, "");
  if(kind==="cum") return "每天新增" + n;
  if(kind==="rank") return n + "（每天最好的一次）";
  return n + "（每天最高 / 全天平均）";
}
function dayNow(rows, kind){
  const r = rows[rows.length-1]; if(!r) return "";
  const tail = r.partial ? "（今天还没过完）" : "";
  if(kind==="rank") return "最近一天最好第 " + Math.round(r.v) + " 名" + tail;
  if(kind==="cum") return "最近一天 +" + fmt(r.v) + tail;
  return "最近一天最高 " + fmt(r.v) + tail;
}
function dayChart(rows, kind){
  const tip = ps => { const r = rows[ps[0].dataIndex]; let s = "<b>" + r.d + "</b>" + (r.partial ? "（今天还没过完）" : "") + "<br>";
    if(kind==="cum") s += "新增 " + fmt(r.v) + (r.gap>1 ? "（中间 " + (r.gap-1) + " 天没抓到，按天平均）" : "") + "<br>累计 " + fmt(r.total);
    else if(kind==="rank") s += "当天最好第 " + Math.round(r.v) + " 名（当天抓了 " + r.n + " 次）";
    else s += "当天最高 " + fmt(r.v) + "，全天平均 " + fmt(r.avg) + "（当天抓了 " + r.n + " 次）";
    return s; };
  const series = [];
  if(kind==="rank") series.push({type:"line", name:"每天最好名次", data:rows.map(r=>r.v), symbol:"circle", symbolSize:5, lineStyle:{width:1.6, color:"#2563eb"}, itemStyle:{color:"#2563eb"}});
  else series.push({type:"bar", name:kind==="cum" ? "每天新增" : "每天最高", barMaxWidth:14, data:rows.map(r=>({value:r.v, itemStyle:{color:"#2563eb", opacity:r.partial ? .45 : .85}}))});
  if(kind==="level") series.push({type:"line", name:"全天平均", data:rows.map(r=>r.avg), symbol:"none", lineStyle:{width:1.5, color:"#d97706"}, itemStyle:{color:"#d97706"}});
  const o = {tooltip:{trigger:"axis", formatter:tip}, grid:{left:8, right:16, top:kind==="level" ? 26 : 12, bottom:8, containLabel:true},
    xAxis:{type:"category", data:rows.map(r=>r.d.slice(5)), axisLabel:{color:"#98a2b3", fontSize:11}},
    yAxis:{type:"value", inverse:kind==="rank", minInterval:1, scale:kind==="level", axisLabel:{formatter:v=>kind==="rank" ? "第" + v : fmt(v), fontSize:11, color:"#98a2b3"}, splitLine:{lineStyle:{color:"#eef0f3"}}},
    series};
  if(kind==="rank") o.yAxis.min = 1;
  if(kind==="level") o.legend = {top:0, left:0, itemWidth:12, itemHeight:8, textStyle:{fontSize:11}};
  return o;
}
// items: [{src, m, pts, prefix}] → {n, html, mount}
function dayBlocks(items, pre){
  const list = [];
  for(const x of items){ if(DAY_HIDE.has(x.m)) continue; const k = metKind(x.m), rows = byDay(x.pts, k); if(rows.length) list.push(Object.assign({}, x, {k, rows})); }
  const html = list.map((x,i)=>'<div class="chart"><div class="l"><span>' + (x.prefix ? esc(x.prefix) + " · " : "") + esc(dayLabel(x.m, x.src, x.k)) + '</span><span class="num">' + esc(dayNow(x.rows, x.k)) + '</span></div>' + chartBox(pre + i, 170) + '</div>').join("");
  return {n:list.length, html, mount:()=>list.forEach((x,i)=>mountChart(pre + i, dayChart(x.rows, x.k)))};
}
// 最近一次的数字，和约 24 小时前比
function hotRows(ms, src){
  return sortMets(Object.keys(ms)).filter(m=>(ms[m]||[]).length && !DAY_HIDE.has(m)).map(m=>{
    const p = ms[m], [t1, v1] = p[p.length-1], k = metKind(m);
    let best = null; for(const q of p){ const dt = Math.abs(q[0] - (t1 - 86400)); if(dt <= 6*3600 && (!best || dt < best.dt)) best = {dt, v:q[1]}; }
    let ch = '<span class="muted">还没有 24 小时前的数</span>', cls = "t2";
    if(best){
      if(k==="rank"){ const d = Math.round(best.v - v1); ch = rankChange(d); cls = d>0 ? "up" : (d<0 ? "down" : "t2"); }
      else if(k==="cum"){ const d = v1 - best.v; ch = (d>0 ? "+" : "") + fmt(d) + "（24 小时新增）"; cls = d>0 ? "up" : "t2"; }
      else { ch = chg(v1, best.v); cls = v1 > best.v*1.01 ? "up" : (v1 < best.v*0.99 ? "down" : "t2"); }
    }
    return '<tr><td class="t2">' + esc(metName(m, src)) + '</td><td class="r num">' + (k==="rank" ? "第 " + Math.round(v1) + " 名" : fmt(v1)) + '</td><td class="r num ' + cls + '">' + ch + '</td><td class="r t2 nowrap">' + dtm(t1) + '</td></tr>';
  }).join("");
}
function imgTag(u){ return u ? '<img src="' + esc(u) + '" alt="" referrerpolicy="no-referrer" onload="if(this.naturalWidth>this.naturalHeight*1.3)this.classList.add(\'wide\')" onerror="this.remove()">' : ""; }

/* ---------- Growth ---------- */
function sproutText(r){
  return `${r.label}：${fmt(r.then)} → ${fmt(r.now)}${r.growth==null?" · 从 0 起量":" · +"+(r.growth*100).toFixed(1)+"%"}${r.hours?" · "+r.hours.toFixed(1)+" 小时":""}`;
}
function spark(series, isRank, w, hgt){
  w = w||96; hgt = hgt||26;
  const vals = (series||[]).map(v => isRank ? (v==null?0:1/v) : v);
  const ok = vals.filter(v=>v!=null);
  if(ok.length<2) return "";
  const lo = Math.min(...ok), hi = Math.max(...ok), n = vals.length;
  const X = i => (i*(w-4)/(n-1)+2).toFixed(1), Y = v => (hgt-2-(hi>lo?(v-lo)/(hi-lo):0.5)*(hgt-4)).toFixed(1);
  let d = "", pen = false;
  vals.forEach((v,i)=>{ if(v==null){ pen=false; return; } d += (pen?"L":"M")+X(i)+" "+Y(v)+" "; pen = true; });
  const last = vals[n-1];
  return `<svg width="${w}" height="${hgt}" viewBox="0 0 ${w} ${hgt}" style="display:block"><path d="${d}" fill="none" stroke="#dc2626" stroke-width="1.6"/>${last!=null?`<circle cx="${X(n-1)}" cy="${Y(last)}" r="2.4" fill="#dc2626"/>`:""}</svg>`;
}
function sproutView(src){
  return risingView(src);
}
const RISING={};
let RISING_SORT="growth";
function risingView(src){
  const cache=RISING[src];
  if(!cache || Date.now()-cache.at>60000){
    if(!cache?.loading){
      RISING[src]={...(cache||{}),loading:true};
      getJSON("/api/rising?source="+encodeURIComponent(src)).then(data=>{
        if(!data) throw new Error("后台未返回数据");
        RISING[src]={data,at:Date.now(),loading:false};
        if(page==="plat"&&PLAT.src===src&&PLAT.tab==="movers") renderContent();
      }).catch(e=>{RISING[src]={error:String(e),at:Date.now(),loading:false};if(PLAT.src===src)renderContent();});

function rawLink(src, id){

  if(src==="poki") return "https://poki.com/en/g/"+e;
  if(src==="crazygames") return "https://www.crazygames.com/game/"+e;
  if(src==="kick") return "https://kick.com/category/"+e;
  if(src==="twitch") return "https://www.twitch.tv/directory/category/"+encodeURIComponent(String(id).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""));
  if(src==="bili") return "https://live.bilibili.com/all";

function judgeVals(){ const a=$("f_alias"), k=$("f_kw"), n=$("f_note"); if(!a||!k||!n) return null; return {aliases:splitList(a.value), keywords:splitList(k.value), note:n.value.trim()}; }

function rememberLabel(member, patch){
  const cur = LOCAL_LABEL[member] ? LOCAL_LABEL[member].v : {};
  LOCAL_LABEL[member] = {v:Object.assign({}, cur, patch), ts:Date.now()};
  const c = cardOf(member); if(c) c.label = Object.assign({}, c.label, patch);
}
function withLocal(c){
  // 刚改过的判断（5 分钟内）盖在服务器给的旧数据上
  for(const m of c.members||[]){ const x = LOCAL_LABEL[m]; if(x && Date.now()-x.ts < 300000) c.label = Object.assign({}, c.label, x.v); }
  return c;
}
async function flushJudge(leaving){
  const J = JUDGE; if(!J) return;
  clearTimeout(J.timer); J.timer = null;
  const v = judgeVals(); if(!v) return;
  const s = JSON.stringify(v); if(s===J.saved) return;
  J.saved = s; rememberLabel(J.member, v);
  const body = Object.assign({member:J.member}, v);
  if(leaving){ try{ fetch("/api/label", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body), keepalive:true}); }catch(e){} return; }
  judgeStatus("正在保存…");
  const ok = await post("/api/label", body);
  if(!ok){ if(JUDGE===J) J.saved = null; judgeStatus("保存失败：雷达程序可能没在运行，重开程序后再改一下"); return; }
  const d = new Date(); judgeStatus("已自动保存（" + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()) + "）");
}

  if(fetchSeries){ loadCharts(c); loadArcGame(c); }
}
async function loadCharts(c){
  const sup = [];
  for(const m of Object.values(c.markets||{})) for(const t of m.targets||[]) for(const x of t.items||[])
    if(x.key && x.status==="launched" && !(c.members||[]).includes(x.key) && !sup.some(s=>s.key===x.key)) sup.push({key:x.key, name:x.name});
  const keys = [...(c.members||[]), ...sup.slice(0,6).map(s=>s.key)];
  const data = (await getJSON("/api/series?days=90&keys="+encodeURIComponent(keys.join(",")))) || {};
  if(openGid!==c.gid) return;
  // v51：按天画，不画每小时的点
  const items = [];
  for(const key of c.members||[]){ const s = key.split(":")[0], ms = data[key]||{}; for(const m of sortMets(Object.keys(ms))) items.push({src:s, m, pts:ms[m], prefix:SRC[s]||s}); }
  const blocks = dayBlocks(items, "dc_");
  const lastOf = pts => { const m = new Map(); for(const [t,v] of pts) m.set(ymd(t), v); return [...m.entries()].map(([d,v])=>[new Date(d+"T12:00:00").getTime(), v]); };
  const own = (c.members||[]).filter(k=>/^tap/.test(k) && (data[k]?.downloads||[]).length>=2).map(k=>({key:k, name:c.name+"（本作）"}));
  const others = sup.filter(s=>(data[s.key]?.downloads||[]).length>=2);
  let h = blocks.html;
  if(others.length) h += '<div class="chart"><div class="l"><span>和 TapTap 上的同类比（累计热度，每天一个点）</span></div>' + chartBox("dc_cmp", 280) + '</div>';
  const el = $("charts"); if(!el) return;
  disposeIn(el);
  el.innerHTML = h || '<div class="muted">数据还不够，至少要抓到一天</div>';
  withCharts(()=>{
    blocks.mount();
    if(others.length) mountChart("dc_cmp", timeLine([...own, ...others].map(s=>({name:s.name, type:"line", showSymbol:false, data:lastOf(data[s.key].downloads)})), "热度"));
  });
}

const HIT = {list:null, game:null, open:null, err:"", loaded:false, loading:false};
async function loadHit(){
  if(HIT.loading) return;

}
async function loadHitGame(id){
  HIT.open = id;
  try{ HIT.game = await getJSON("/api/hit/game?id="+encodeURIComponent(id)); }

  if(page==="hit") renderContent();
}
function hitView(){

    `<table class="tbl"><thead><tr><th>游戏</th><th>总播放</th><th>视频</th><th>UP</th>
      <th>播放中位</th><th>最高单条</th><th>起点</th><th>起爆日</th><th>峰值日</th><th>峰值/天</th><th>回落一半</th>
    </tr></thead><tbody>${rows}</tbody></table>`);
  if(HIT.open && HIT.game) h += hitGameView(HIT.game);

function hitGameView(g){
  if(g.error) return panel("详情","", `<div class="up">${esc(g.error)}</div>`);
  const s = g.summary || {}, lc = s.lifecycle || {};
  const kv = [
    ["总播放", fmt(s.play_sum)], ["视频数", s.n_video], ["UP 主数", s.n_up],
    ["播放中位数", fmt(s.play_median)], ["最高单条", fmt(s.play_top1)],
    ["起点", lc.start], ["起爆日", lc.burst || "未识别"],
    ["峰值日", lc.peak_day], ["峰值/天", lc.peak_video],
    ["回落一半", lc.half_day || "未回落"], ["跨度天数", lc.days],
  ].map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="num">${v??"-"}</span></div>`).join("");

  const upRows = (g.up_structure||[]).map(x=>`<tr>
    <td>${esc(x.tier)}</td><td class="r num">${x.n_up}</td><td class="r num">${x.n_video}</td>
    <td class="r num">${fmt(x.play)}</td><td class="r num">${(x.play_pct*100).toFixed(1)}%</td></tr>`).join("");

  const topRows = (g.top||[]).map((v,i)=>`<tr>
    <td class="r num">${i+1}</td>
    <td><a class="lnk" href="${esc(v.url)}" target="_blank">${esc(v.title)}</a></td>
    <td>${esc(v.up)}</td><td class="r num">${v.followers==null?"-":fmt(v.followers)}</td>
    <td>${esc(v.tier)}</td><td class="r num">${fmt(v.play)}</td><td>${esc(v.day)}</td></tr>`).join("");

  return panel(`${esc(g.name)} · 全部数据`, "",
    `<div class="notice">${esc(g.note||"")}</div>${kv}
     <h3 style="margin:16px 0 6px;font-size:14px">每天新增视频和播放</h3>
     ${chartBox("hitDaily", 300)}
     <h3 style="margin:16px 0 6px;font-size:14px">UP 主粉丝档结构</h3>
     ${chartBox("hitUp", 240)}
     <table class="tbl" style="margin-top:8px"><thead><tr><th>粉丝档</th><th>UP 数</th><th>视频数</th><th>播放</th><th>占总播放</th></tr></thead><tbody>${upRows}</tbody></table>
     <h3 style="margin:16px 0 6px;font-size:14px">播放前 20</h3>
     <table class="tbl"><thead><tr><th>#</th><th>视频</th><th>UP 主</th><th>粉丝</th><th>档位</th><th>播放</th><th>发布</th></tr></thead><tbody>${topRows}</tbody></table>`);
}

function renderLive(){
  const n = nowText(), s = ACT.state||{};
  $("pulse").className = "pulse" + (n.busy?" on":"");
  let txt = n.title; if(n.busy && s.detail) txt += "  ·  " + s.detail;
  if(!n.busy && n.sub) txt += "  ·  " + n.sub.split("  ·  ")[0];
  $("liveText").textContent = txt;
  $("live").title = n.title + (n.sub?"\n"+n.sub:"");
}
async function pollActivity(){
  try{
    const r = await (await fetch("/api/activity?after="+ACT.seq,{cache:"no-store"})).json();
    ACT.state = r.state; ACT.seq = r.seq;
    if(r.lines && r.lines.length){ LOG.push(...r.lines); if(LOG.length>1000) LOG = LOG.slice(-1000); }
    renderLive();
    if(page==="status"){
      const term = $("term");
      if(term){ const atBottom = term.scrollHeight - term.scrollTop - term.clientHeight < 40; term.innerHTML = termHtml(); if(atBottom) term.scrollTop = term.scrollHeight; }
      const nc = $("nowcard"); if(nc) nc.outerHTML = nowCard();
    }
    if(lastRev!==null && r.state.rev!==lastRev){ runs = null; STATS = null; IDX = null; ARC.data = null; FRESH.data = null; for(const b of Object.values(BD)){ b.stale = true; } load(); }
    lastRev = r.state.rev;
  }catch(e){
    $("pulse").className = "pulse"; $("liveText").textContent = "连接不上雷达程序（可能已退出）";
  }
}

/* ---------- 事件 ---------- */
function splitList(s){ return s.split(/[,，、]/).map(x=>x.trim()).filter(Boolean); }
async function afterChange(msg){ toast(msg + "，几秒后重新排名"); for(const t of [3000, 8000, 15000, 30000]) setTimeout(load, t); }
function resolvePage(p){
  if(p.startsWith("hub:")&&HUBS[p.slice(4)]){
    PLAT={src:p,tab:"raw"};return "plat";
  }
  if(p==="maker" || p==="tapboard"){
    PLAT={src:p==="maker"?"tapmaker":"taptap",tab:"movers"};
    return "plat";
  }
  if(p==="kw"){ PLAT={src:"bvideo",tab:"raw"}; return "plat"; }
  if(p==="bili-growth"){ PLAT={src:"bvideo",tab:"movers"}; return "plat"; }
  if(p==="video"){ PLAT={src:"hub:video",tab:"raw"}; return "plat"; }
  if(["must","revenue","trend","combined"].includes(p)) return "heat";
  return PAGES.some(x=>x.k===p)?p:"heat";
}
function pageHash(){
  if(page==="plat"&&PLAT.src==="hub:video") return "#video";
  if(page==="plat"&&PLAT.src.startsWith("hub:")&&HUBS[PLAT.src.slice(4)])return "#"+PLAT.src;
  if(page==="plat"&&PLAT.src==="bvideo"&&PLAT.tab==="movers") return "#bili-growth";
  return page==="plat"&&PLAT.src==="bvideo"&&PLAT.tab==="raw"?"#kw":"#"+page;
}
function goPage(p){
  page = resolvePage(p); history.replaceState(null,"",pageHash());
  if(page==="status"){ runs=null; STATS=null; }
  if(page==="plat"){ FRESH.data=null; RAW.data=null; IDX=null; }
  const sc = curBoard(); if(sc && bstate(sc).stale){ const b=bstate(sc); b.stale=false; b.data=null; b.games=null; }
  contentPage = null; render(); document.querySelector("main").scrollTo(0,0); window.scrollTo(0,0);
}
document.addEventListener("click", async e=>{
  const t = e.target.closest("[data-page],[data-heatreload],[data-heatmore],[data-dismiss],[data-undismiss],[data-unblock2],[data-kwtab],[data-sttab],[data-mkscope],[data-gid],[data-game],[data-block],[data-close],[data-stars],[data-save],[data-blockcard],[data-unblock],[data-period],[data-reload-board],[data-gsort],[data-cmp],[data-unpick],[data-more],[data-cmpclose],[data-reload-idx],[data-rawreload],[data-rawsort],[data-rawmore],[data-freshsrc],[data-plat],[data-pgroup],[data-ptab],[data-split],[data-hit],#refresh,#refresh2,#mask,#reloadRuns,#reloadStats");
  if(!t) return;
  // v51：整行都能点开详情；行里的“打开原网页”链接、勾选框照常用
  if(t.tagName==="TR" && e.target.closest("a[href],input,select,textarea,label,button,details")) return;
  const sc = curBoard();
  if(t.dataset.page){ goPage(t.dataset.page); return; }
  if(t.dataset.heatreload!==undefined){ await loadHeat(true); return; }
  if(t.dataset.heatmore!==undefined){ HEAT.limit+=200; renderContent(); return; }
  if(t.dataset.plat){ e.preventDefault(); pickPlat(t.dataset.plat); return; }
  if(t.dataset.split){ const ok = await post("/api/archive/split",{member:t.dataset.split}); toast(ok?"已拆出，重新打分后生效":"拆出失败：雷达程序可能没在运行"); if(ok && openGid){ const c=findCard(openGid); if(c) loadArcGame(c); } ARC.data=null; return; }
if(t.dataset.hit){ loadHitGame(t.dataset.hit); return; }
  if(t.dataset.ptab){ PLAT.tab=t.dataset.ptab; history.replaceState(null,"",pageHash()); if(PLAT.tab==="fresh") FRESH.data=null; else if(PLAT.tab==="movers") IDX=null; else if(PLAT.tab==="raw") RAW.data=null; contentPage=null; renderContent(); return; }
  if(t.dataset.mkscope){ MKSCOPE=t.dataset.mkscope; contentPage=null; renderContent(); return; }
  if(t.dataset.dismiss || t.dataset.undismiss || t.dataset.unblock2){
    e.stopPropagation();
    const gid = t.dataset.dismiss || t.dataset.undismiss || t.dataset.unblock2, c = findCard(gid); if(!c) return;
    if(t.dataset.dismiss) await post("/api/label",{member:c.members[0], dismissed:Math.max(+c.hot||0, 0.01)});
    else for(const m of c.members) await post("/api/label", t.dataset.undismiss ? {member:m, dismissed:0} : {member:m, blocked:false});
    if(openGid===gid) closeDrawer();
    const from = t.dataset.dismiss ? "cards" : (t.dataset.undismiss ? "dismissed" : "blocked");
    S[from] = (S[from]||[]).filter(x=>x.gid!==gid); render();
    afterChange(t.dataset.dismiss ? "已收进“先不看”，热度涨很多会回来" : "已放回热度"); return;
  }
  if(t.dataset.game){ e.preventDefault();
    // v50：这个游戏在必看 / 老游戏 / 先不看 / 不做里有卡片，就打开和必看一样的完整详情；没有就打开它自己的资料和走势
    const card = cardOf(t.dataset.game);
    if(card) openDrawer(card.gid); else openGame(t.dataset.game, t.dataset.name||t.dataset.game);
    return; }
  if(t.id==="refresh" || t.id==="refresh2"){ await post("/api/run",{}); toast("已开始刷新，几分钟后自动更新"); return; }
  if(t.id==="mask" || t.dataset.close!==undefined){ closeDrawer(); return; }
  if(t.id==="reloadRuns"){ runs=null; STATS=null; renderContent(); return; }
  if(t.id==="reloadStats"){ STATS=null; renderContent(); return; }
  if(t.dataset.reloadIdx!==undefined){ IDX=null; renderContent(); return; }
  if(t.dataset.rawreload!==undefined){ RAW.data=null; renderContent(); return; }
  if(t.dataset.rawsort){ RAW.sort=t.dataset.rawsort; renderContent(); return; }
  if(t.dataset.rawmore!==undefined){ RAW.limit+=300; renderContent(); return; }
  if(t.dataset.freshsrc){ FRESH.src=t.dataset.freshsrc; renderContent(); return; }
  if(t.dataset.period && sc){ const b=bstate(sc); if(b.period!==t.dataset.period){ b.period=t.dataset.period; b.data=null; renderContent(); } return; }
  if(t.dataset.reloadBoard){ const b=bstate(t.dataset.reloadBoard); b.data=null; b.games=null; renderContent(); loadBoard(t.dataset.reloadBoard, true); return; }
  if(t.dataset.gsort && sc){ const b=bstate(sc), k=t.dataset.gsort; b.sort = b.sort.k===k ? {k, d:-b.sort.d} : {k, d:(k==="name"?1:-1)}; rerenderGames(sc); return; }
  if(t.dataset.cmp){ doCompare(t.dataset.cmp); return; }
  if(t.dataset.unpick){ const b=bstate(t.dataset.unpick); b.picked.clear(); rerenderGames(t.dataset.unpick); return; }
  if(t.dataset.more){ const b=bstate(t.dataset.more); b.limit += 200; rerenderGames(t.dataset.more); return; }
  if(t.dataset.cmpclose){ const b=bstate(t.dataset.cmpclose); b.cmp=null; renderContent(); return; }
  if(t.dataset.gid){ openDrawer(t.dataset.gid); return; }
  if(t.dataset.block){ await post("/api/label",{member:t.dataset.block, blocked:true}); S.keywords=(S.keywords||[]).filter(x=>x.key!==t.dataset.block); renderContent(); afterChange("已标记，不再显示"); return; }
  if(t.dataset.stars!==undefined){
    // v51：打分只改按钮本身，不重画详情（以前重画会跳回顶上）；必看里的和各平台里的游戏都能打
    const J = JUDGE; if(!J) return;
    const n = +t.dataset.stars;
    const seg = $("d_stars"); if(seg) seg.innerHTML = starBtns(n||null);
    const clr = $("d_clear"); if(clr) clr.style.display = n ? "" : "none";
    rememberLabel(J.member, {stars:n||null});
    judgeStatus("正在保存…");
    const ok = await post("/api/label", {member:J.member, stars:n});
    judgeStatus(ok ? (n ? "已保存：" + n + " 分" : "已清除打分") : "保存失败：雷达程序可能没在运行");
    if(ok && J.card) afterChange(n ? "已设为 " + n + " 分" : "已清除"); else if(ok) toast(n ? "已保存 " + n + " 分" : "已清除");
    return;
  }
  const c = openGid && findCard(openGid); if(!c) return;
  const member = c.members[0];
  if(t.dataset.blockcard!==undefined){ await post("/api/label",{member, blocked:true}); closeDrawer(); afterChange("已标记为不做"); return; }
  if(t.dataset.unblock!==undefined){ for(const m of c.members) await post("/api/label",{member:m, blocked:false}); closeDrawer(); afterChange("已恢复"); return; }
});
document.addEventListener("change", e=>{
