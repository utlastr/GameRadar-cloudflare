    tip.style.left = Math.max(8, Math.min(innerWidth - tip.offsetWidth - 8, cx + 16)) + "px";
    tip.style.top = Math.max(8, Math.min(innerHeight - tip.offsetHeight - 8, cy + 16)) + "px";
  });
}
function badge(k, s, enOnly, sh) {
  const cc = ccOf(k), c = R && R.countries[cc], p = PL(k), cl = clusterOf(k);
  const g0 = cl && cl.games[0] ? gameInfo(cl.games[0]) : null;
  const emb = cl ? `<div class="emb">${g0 && g0.icon ? `<img src="${esc(g0.icon)}" referrerpolicy="no-referrer">` : ""}</div>` : "";
  let t3 = "";
  if (!R || (!R.places && c && c.aff && c.aff.length)) {
    const own = c && c.aff.find(a => a[0] === c.cluster), other = c && c.aff.find(a => a[0] !== c.cluster);
    if (other && own && other[1] >= own[1] * .85) { const oc = CL.find(x => x.id === other[0]); t3 = `Also close to ${esc(oc ? clName(oc) : other[0])}`; }
  }
  const same = selCC && k !== selCC && SELSET ? (SELSET.has(k) ? " · same circle" : " · other circle") : "";
  const unit = sh && sh.u >= 0;
  const title = unit ? unitName(sh) + (p && p.units.length > 1 ? ` · ${p.name}` : "") : nameK(k, !enOnly);
  const traits = cl && cl.traits && cl.traits.length ? "Leans: " + cl.traits.map(([g, x]) => `${esc(gEn(g))} ×${x}`).join(", ") : "";
  const likes = p && p.likes && p.likes.length ? `More than rest of ${esc(enName(cc))}: ` + p.likes.slice(0, 3).map(([a, x]) => `${esc(appOf(a).name)} ×${x}`).join(", ") : "";
  const top = o => Object.entries(o || {}).filter(([, x]) => x >= 1.15).sort((a, b) => b[1] - a[1]);
  const plat = p ? top(Object.assign({}, p.plat, p.ent)).slice(0, 4).map(([n, x]) => `${esc(n)} ×${x}`).join(" · ") : "";
  const none = !R ? "Data not ready" : unit && R.places && !p ? "No regional data yet" : "No chart data";
  return `<div class="bdg">${emb}<div><div class="t1">${esc(title)}&ensp;<span class="m">${fmtInc(unit ? incS(sh) : incK(k))}${same}</span></div>`
    + `<div class="t2">${cl ? esc(clName(cl)) : none}</div>`
    + (cl ? `<div class="t3">${cl.solo ? "Unlike anywhere else" : cl.members.length + " places"}${g0 ? " · Top: " + esc(g0.name) : ""}</div>` : "")
    + (traits ? `<div class="t3">${traits}</div>` : "")
    + (likes ? `<div class="t3">${likes}</div>` : "")
    + (plat ? `<div class="t3">${plat}</div>` : "")
    + (t3 ? `<div class="t3">${t3}</div>` : "") + `</div></div>`;
}
function setHover(k) {
  if (selCC || CLSET) return;
  const cl = k && clusterOf(k), id = cl ? cl.id : null;
  if (id === hovCl) return;
  hovCl = id; HOVSET = cl ? new Set(cl.members) : null;
  repaint();
}
let gDown = null;
gEl.addEventListener("pointerdown", e => { gDown = { x: e.clientX, y: e.clientY }; });
gEl.addEventListener("pointerup", e => { if (gDown && Math.hypot(e.clientX - gDown.x, e.clientY - gDown.y) < 5) clickAt(e.clientX, e.clientY); gDown = null; });
gEl.addEventListener("pointermove", e => { if (!e.buttons) hoverAt(e.clientX, e.clientY); });
gEl.addEventListener("pointerleave", () => { $("tip").style.display = "none"; setHover(null); });

function repaint() {
  const want = showBd ? SHAPES : [];
  if (world.polygonsData() !== want) world.polygonsData(want).labelsData(showBd ? MARKS : []);
  world.polygonCapColor(f => capColor(f))
    .polygonStrokeColor(f => selCC && (keyOf(f) === selCC || (f.cc === selCC && !NEAR[selCC])) ? "#ffffff" : f.u >= 0 ? "rgba(255,255,255,.1)" : "rgba(255,255,255,.18)")
    .labelColor(d => capColor({ cc: d.cc, u: -1 }, 1));
  if (mode === "flat") drawFlat();
}
function layout() {
  document.body.classList.toggle("sel", !!(selCC || selCl));
  return false;
}
function select(cc) {
  selCC = cc; selCl = null; CLSET = null; HOVSET = null; hovCl = null;
  MAXSIM = 1;
  const cl = cc && clusterOf(cc);
  SELSET = cl ? new Set(cl.members) : null;
  repaint(); renderPanel();
}
function selectCluster(id) {
  selCC = null; selCl = id; HOVSET = null; hovCl = null;
  const cl = CL.find(c => c.id === id);
  CLSET = cl ? new Set(cl.members) : null;
  repaint(); renderPanel();
}

/* ---------- 右侧 ---------- */
function statusText() {
  const st = (W && W.status) || {};
  const parts = [];
  if (st.phase === "scan") parts.push(`Fetching charts ${st.done || 0}/${st.total || 0}`);
  else if (st.phase === "genre") parts.push("Looking up genres");
  if (st.blocked || st.phase === "blocked") parts.push("App Store refused access");
  if (st.phase === "error") parts.push("Error");
  const rs = (W && W.regions) || {};
  const split = R && R.places ? new Set(Object.keys(R.places).filter(isPl).map(ccOf)).size : 0;
  const nm = (rs.markets || []).length;
  if (rs.phase === "borders") parts.push("Regions: downloading borders");
  else if (rs.geo_error && !RG) parts.push(`Region borders failed: ${rs.geo_error}`);
  else if (nm) {
    const pr = rs.prog || {}, done = Object.values(pr).reduce((a, v) => a + v[0], 0), tot = Object.values(pr).reduce((a, v) => a + v[1], 0);
    parts.push(`Regions: ${split}/${nm} countries split${tot ? ` · searches ${done}/${tot}` : ""}${rs.phase === "fetch" ? ` · now ${String(rs.cc || "").toUpperCase()}` : ""}`);
    if (!rs.baidu && rs.markets.includes("cn")) parts.push("CN needs BAIDU_COOKIE");
  }
  if (rs.phase === "blocked") parts.push(`Google Trends refused: ${rs.blocked || ""}`);
  else if (rs.last_error) parts.push(`Last error: ${rs.last_error}`);
  if (R) parts.push(`${R.places ? Object.keys(R.places).length : R.order.length} places · ${CL.filter(c => !c.solo).length} groups · ${R.n_games} games · ${new Date(R.updated * 1000).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}`);
  else if (!st.phase) parts.push("Waiting for first fetch");
  if (st.n_errors) parts.push(`${st.n_errors} charts failed`);
  return parts.join(" · ");
}
function simRows(cc) {
  const c = R.countries[cc];
  return c.similar.map(([o, s]) => `<div class="row" data-cc="${o}"><span class="nm">${esc(enName(o))}</span><span class="bar2"><i style="width:${Math.round(Math.min(1, s / MAXSIM) * 100)}%"></i></span><span class="v">${Math.round(s * 100)}%</span></div>`).join("");
}
function countryCard(cc) {
  const c = R && R.countries[cc];
  let h = `<span class="x" data-x>×</span><h2>${esc(enName(cc))}</h2><div class="m">Income per person ${fmtInc(incOf(cc))}</div>`;
  if (!c) return h + `<p class="m">No chart data here yet</p>`;
  const cl = clusterOf(cc);
  if (cl) h += `<div data-cl="${cl.id}" style="cursor:pointer">${badge(cc, null, true)}</div>`;
  if (!R.places && c.aff && c.aff.length) h += c.aff.map(([id, v]) => { const x = CL.find(q => q.id === id); return x ? `<span class="badge" data-cl="${id}">${esc(clName(x))} ${Math.round(v * 100)}%</span>` : ""; }).join("");
  const regs = R.places ? Object.keys(R.places).filter(k => isPl(k) && ccOf(k) === cc).sort((a, b) => R.places[b].pop - R.places[a].pop) : [];
  if (regs.length) {
    const by = new Map();
    for (const k of regs) { const id = R.places[k].cluster || ""; if (!by.has(id)) by.set(id, []); by.get(id).push(k); }
    h += `<h3>Circles in ${esc(enName(cc))}</h3>` + [...by.entries()].map(([id, ks]) => circleBlock(CL.find(x => x.id === id), ks)).join("");
  }
  h += `<div class="m" style="margin-top:6px">Charts of ${esc(c.day)}${c.noise ? ` · self-similarity ${Math.round(c.noise.floor * 100)}% (${c.noise.day != null ? "vs previous day " + Math.round(c.noise.day * 100) + "%, " : ""}resampled ${Math.round(c.noise.boot * 100)}%)` : ""}${R.threshold ? ` · group line ${Math.round(R.threshold * 100)}%` : ""}</div>`;
  h += `<h3>Games liked more than the global average</h3>` + c.games.map(g => `<div class="gm">${g.icon ? `<img src="${esc(g.icon)}" loading="lazy" referrerpolicy="no-referrer">` : `<img>`}<div><div class="n">${esc(g.name)}</div><div class="s">${esc(g.artist)}${g.genres.length ? " · " + esc(g.genres.map(gEn).join(", ")) : ""}</div><div class="s">${g.rg ? "Grossing #" + g.rg : ""}${g.rg && g.rf ? " · " : ""}${g.rf ? "Free #" + g.rf : ""} · charting in ${g.spread} places</div></div><span class="lq">×${g.lq ?? "—"}</span></div>`).join("");
  if (c.genres.length) h += `<h3>Genres liked more</h3>` + c.genres.map(g => `<span class="chip">${esc(gEn(g.g))} ×${g.lq}</span>`).join("");
  if (c.devs.length) h += `<h3>Publishers liked more</h3>` + c.devs.map(d => `<span class="chip">${esc(d.name)}${d.lq ? " ×" + d.lq : ""}</span>`).join("");
  h += `<h3>Most similar taste</h3>` + simRows(cc);
  return h;
}
function clusterCard(id) {
  const cl = CL.find(c => c.id === id);
  if (!cl) return "";
  const th = R.places ? R.pthreshold : R.threshold;
  let h = `<span class="x" data-x>×</span><h2>${esc(clName(cl))}</h2><div class="m">${cl.members.length} places · avg similarity ${Math.round(cl.cohesion * 100)}%${th ? ` · group line ${Math.round(th * 100)}%` : ""}</div>`;
  if (cl.ent && cl.ent.length) h += `<h3>Entertainment leaning</h3>` + cl.ent.map(([n, x]) => `<span class="chip">${esc(n)} ×${x}</span>`).join("");
  if (cl.traits && cl.traits.length) h += `<h3>Genres liked more</h3>` + cl.traits.map(([g, x]) => `<span class="chip">${esc(gEn(g))} ×${x}</span>`).join("");
  if (cl.games.length) h += `<h3>Representative games</h3>` + cl.games.map(gameInfo).map(g => `<div class="gm">${g.icon ? `<img src="${esc(g.icon)}" loading="lazy" referrerpolicy="no-referrer">` : `<img>`}<div><div class="n">${esc(g.name)}</div><div class="s">charting in ${g.in}/${cl.members.length} members</div></div></div>`).join("");
  h += `<h3>Members</h3>`;
  h += cl.members.map(m => `<div class="row" data-cc="${m}"><span class="nm" style="width:auto">${esc(nameKC(m))}</span><span class="v" style="margin-left:auto;width:auto">${fmtInc(incK(m))}</span></div>`).join("");
  return h;
}
const fmtPop = v => v >= 1e6 ? (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + "M" : v >= 1e3 ? Math.round(v / 1e3) + "k" : String(Math.round(v || 0));
const placeRow = k => `<div class="row" data-cc="${k}"><span class="nm" style="width:auto">${esc(nameK(k, true))}</span><span class="v" style="margin-left:auto;width:auto">${fmtPop(R.places[k].pop)} · ${fmtInc(incK(k))}</span></div>`;
const gameRow = (a, x, sub) => { const g = appOf(a); return `<div class="gm">${g.icon ? `<img src="${esc(g.icon)}" loading="lazy" referrerpolicy="no-referrer">` : `<img>`}<div><div class="n">${esc(g.name)}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div><span class="lq">×${x}</span></div>`; };
const chips = o => Object.entries(o || {}).sort((a, b) => b[1] - a[1]).map(([n, x]) => `<span class="chip"${x >= 1.15 ? ' style="border-color:#ffb45a"' : x <= .87 ? ' style="opacity:.55"' : ""}>${esc(n)} ×${x}</span>`).join("");
function circleBlock(cl, ks) {
  if (!cl) return `<div class="cl"><div class="mem">${ks.map(m => `<span data-cc="${m}">${esc(nameK(m))}</span>`).join(" · ")}</div></div>`;
  const here = new Set(ks), rest = cl.members.filter(m => !here.has(m));
  const ent = cl.ent && cl.ent.length ? cl.ent.map(([n, x]) => `<span class="chip">${esc(n)} ×${x}</span>`).join("") : "";
  return `<div class="cl" data-cl="${cl.id}" style="cursor:pointer"><div>${esc(clName(cl))}${cl.solo ? " · solo" : ""}</div>${ent ? `<div style="margin-top:4px">${ent}</div>` : ""}`
    + `<div class="mem">${ks.map(m => `<span data-cc="${m}">${esc(nameK(m))}</span>`).join(" · ")}${rest.length ? ` <span class="m">+ ${rest.length} elsewhere</span>` : ""}</div></div>`;
}
function placeCard(k) {
  const p = PL(k);
  if (!p) return "";
  const cc = p.cc, cl = clusterOf(k);
  let h = `<span class="x" data-x>×</span><h2>${esc(nameK(k, true))}</h2><div class="m"><span data-cc="${cc}" style="cursor:pointer;text-decoration:underline">${esc(enName(cc))}</span> · population ${fmtPop(p.pop)} · income per person ${fmtInc(incK(k))}</div>`;
  if (cl) h += `<div data-cl="${cl.id}" style="cursor:pointer">${badge(k, null, true)}</div>`;
  if (p.likes && p.likes.length) h += `<h3>Liked more than the rest of ${esc(enName(cc))}</h3>` + p.likes.map(([a, x]) => gameRow(a, x)).join("");
  if (p.ent && Object.keys(p.ent).length) h += `<h3>Entertainment vs ${esc(enName(cc))} average</h3>` + chips(p.ent);
  if (p.plat && Object.keys(p.plat).length) h += `<h3>Gaming platforms vs ${esc(enName(cc))} average</h3>` + chips(p.plat);
  if (cl && !cl.solo) h += `<h3>Same circle</h3>` + cl.members.filter(m => m !== k).map(m => `<div class="row" data-cc="${m}"><span class="nm" style="width:auto">${esc(nameKC(m))}</span></div>`).join("");
  return h;
}
function renderStatus() {
  const st = (W && W.status) || {}, el = $("st");
  el.textContent = statusText();
  el.title = Object.entries(st.errors || {}).map(([k, v]) => `${k}: ${v}`).join("\n");
}
function renderLegend() {
  $("lgt").innerHTML = `<span class="z" style="left:0">Moon · Sun · Mars · Proxima<br>$0k</span>` + ["cn", "us"].map(cc => {
    const v = incOf(cc);
    if (!v) return "";
    const p = Math.max(0, Math.min(1, (Math.log(v) - LMIN) / (LMAX - LMIN))) * 100;
    return `<span style="left:${p}%">${esc(enName(cc))}<br>${fmtInc(v)}</span>`;
  }).join("");
}
function renderPanel() {
  renderStatus();
  const h = selCC ? (isPl(selCC) ? placeCard(selCC) : countryCard(selCC)) : selCl && R ? clusterCard(selCl) : "";
  if (!h) { selCC = null; selCl = null; }
  $("panel").innerHTML = h;
  $("panel").scrollTop = 0;
  if (layout() && mode === "flat") drawFlat();
}
$("panel").addEventListener("click", e => {
  const t = e.target.closest("[data-cc],[data-cl],[data-x]");
  if (!t) return;
  if (t.dataset.cc) select(t.dataset.cc);
  else if (t.dataset.cl) selectCluster(t.dataset.cl);
  else if (t.dataset.x !== undefined) select(null);
});

$("mode").addEventListener("click", e => {
  mode = mode === "globe" ? "flat" : "globe";
  e.target.textContent = mode === "globe" ? "Flat" : "Globe";
  gEl.style.display = mode === "globe" ? "" : "none";
  flat.style.display = mode === "flat" ? "block" : "none";
  solEl.style.display = mode === "globe" ? "" : "none";
  $("tip").style.display = "none";
  world.pauseAnimation && (mode === "flat" ? world.pauseAnimation() : world.resumeAnimation());
  if (mode === "flat") {
    if (focus === "earth") { const pv = world.pointOfView(); fv.x = mX(pv.lng); fv.y = mY(pv.lat); }
    if (!fv.init) { fv.z = Math.log2(Math.max(flat.clientWidth, 256) / 512); fv.init = true; }
    drawFlat();
  }
});
$("bd").addEventListener("click", e => {
  showBd = !showBd;
  e.target.classList.toggle("on", showBd);
  repaint();
});
const INC_LO = Math.log(2000), INC_HI = Math.log(200000);
function dotButtons() {
  $("pop").classList.toggle("on", showPop && dotMode === "pop");
  $("inc").classList.toggle("on", showPop && dotMode === "inc");
  $("incw").style.display = showPop && dotMode === "inc" ? "" : "none";
  $("incv").textContent = fmtInc(refInc);
}
for (const id of ["pop", "inc"]) $(id).addEventListener("click", () => {
  if (showPop && dotMode === id) showPop = false; else { showPop = true; dotMode = id; }
  dotButtons(); refreshDots();
});
$("incr").value = Math.round((Math.log(refInc) - INC_LO) / (INC_HI - INC_LO) * 1000);
let incRaf = 0;
$("incr").addEventListener("input", e => {
  const raw = Math.exp(INC_LO + (INC_HI - INC_LO) * e.target.value / 1000), st = Math.pow(10, Math.floor(Math.log10(raw)) - 1);
  refInc = Math.round(raw / st) * st;
  $("incv").textContent = fmtInc(refInc);
  clearTimeout(incRaf);
  incRaf = setTimeout(refreshDots, 120);
});
dotButtons();
addEventListener("resize", () => {
  world.width(gEl.clientWidth).height(gEl.clientHeight);
  if (mode === "flat") drawFlat();
});

let lastUpdated = null, loadTimer = 0;
async function load() {
  clearTimeout(loadTimer);
  const w = await getJSON("/api/world");
  if (!w) { $("st").textContent = "Can't reach the radar"; loadTimer = setTimeout(load, 30000); return; }
  const first = !W;
  W = w; R = w.result;
  const igNew = (!IG || IG.kind !== 2) && await loadIncGrid();
  if (first || igNew) { dotIncomes(); if (dotMode === "inc") refreshDots(); }
  let rgNew = false;
  if (!RG) { const rg = await getJSON("/api/regions"); if (rg && rg.units) { setRegions(rg); buildFlatGeo(); rgNew = true; } }
  IDX = {}; NEAR = {}; UP = []; PINC = {}; CL = [];
  if (R) {
    R.order.forEach((cc, i) => IDX[cc] = i);
    CL = R.pclusters || R.clusters || [];
    for (const c of CL) c.games = c.games || [];
    if (R.places) {
      for (const [k, p] of Object.entries(R.places)) {
        NEAR[k] = new Map(p.near || []);
        if (p.units) for (const u of p.units) UP[u] = k;
      }
    } else R.order.forEach((a, i) => { NEAR[a] = new Map(R.order.map((b, j) => [b, R.sim[i][j]]).filter(([b]) => b !== a)); });
  }
  renderLegend();
  if ((R && R.updated !== lastUpdated) || rgNew) { lastUpdated = R && R.updated; if (selCC) select(selCC); else if (selCl) selectCluster(selCl); else { repaint(); renderPanel(); } }
  else renderStatus();
  loadTimer = setTimeout(load, (W.status || {}).phase === "scan" || ["fetch", "borders"].includes((W.regions || {}).phase) ? 20000 : 300000);
}
repaint();
renderLegend();
await load();
</script>
</body>
