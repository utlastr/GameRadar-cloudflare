const fmtPop = v => v >= 1e6 ? (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + "M" : v >= 1e3 ? Math.round(v / 1e3) + "k" : String(Math.round(v || 0));

const gameRow = (a, x, sub) => { const g = appOf(a); return `<div class="gm">${g.icon ? `<img src="${esc(g.icon)}" loading="lazy" referrerpolicy="no-referrer">` : `<img>`}<div><div class="n">${esc(g.name)}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div><span class="lq">×${x}</span></div>`; };
const chips = o => Object.entries(o || {}).sort((a, b) => b[1] - a[1]).map(([n, x]) => `<span class="chip"${x >= 1.15 ? ' style="border-color:#ffb45a"' : x <= .87 ? ' style="opacity:.55"' : ""}>${esc(n)} ×${x}</span>`).join("");
function circleBlock(cl, ks) {
  if (!cl) return `<div class="cl"><div class="mem">${ks.map(m => `<span data-cc="${m}">${esc(nameK(m))}</span>`).join(" · ")}</div></div>`;
  const here = new Set(ks), rest = cl.members.filter(m => !here.has(m));
  const ent = cl.ent && cl.ent.length ? cl.ent.map(([n, x]) => `<span class="chip">${esc(n)} ×${x}</span>`).join("") : "";
  return `<div class="cl" data-cl="${cl.id}" style="cursor:pointer"><div>${esc(clName(cl))}${cl.solo ? " · solo" : ""}</div>${ent ? `<div style="margin-top:4px">${ent}</div>` : ""}`
    + `<div class="mem">${ks.map(m => `<span data-cc="${m}">${esc(nameK(m))}</span>`).join(" · ")}${rest.length ? ` <span class="m">+ ${rest.length} elsewhere</span>` : ""}</div></div>`;
}
let PF = null;
const PF_HOW = { country: "specific to this country", region: "shared by the region", general: "general list" };
function platBlock(cc) {
  const c = PF && PF.by_cc && PF.by_cc[cc];
  if (!c) return "";
  return `<h3>Platforms people use</h3>` + PF.cats.map(([k, label]) => {
    const g = c[k]; if (!g) return "";
    const apps = g.apps.map(a => { const x = PF.apps[a] || { name: a }; return `<div class="a">${x.icon ? `<img src="${esc(x.icon)}" loading="lazy" referrerpolicy="no-referrer">` : `<b>${esc((x.name || a)[0])}</b>`}${esc(x.name || a)}</div>`; }).join("");
    return `<div class="pf"><div class="pl">${esc(label)}<span>${esc(PF_HOW[g.how] || "")}</span></div><div class="ap">${apps}</div></div>`;
  }).join("");
}
async function loadPF() {
  const p = await getJSON("/api/platforms");
  if (!p) return;
  const missing = Object.values(p.apps).some(a => !a.icon) && Object.keys(p.errors || {}).length < Object.values(p.apps).filter(a => !a.icon).length;
  PF = p;
  if (selCC) renderPanel();
  if (missing) setTimeout(loadPF, 20000);
}
function placeCard(k) {
  const p = PL(k);
  if (!p) return "";
  const cc = p.cc, cl = clusterOf(k);
  let h = `<span class="x" data-x>×</span><h2>${esc(nameKC(k))}</h2><div class="m"><span data-cc="${cc}" style="cursor:pointer;text-decoration:underline">${esc(enName(cc))}</span> · population ${fmtPop(p.pop)} · spending ${fmtInc(incK(k))} / person</div>`;
  if (cl) h += `<div data-cl="${cl.id}" style="cursor:pointer">${badge(k, null, true)}</div>`;
  h += platBlock(cc);
  if (p.likes && p.likes.length) h += `<h3>Liked more than the rest of ${esc(enName(cc))}</h3>` + p.likes.map(([a, x]) => gameRow(a, x)).join("");
  if (p.ent && Object.keys(p.ent).length) h += `<h3>Entertainment vs ${esc(enName(cc))} average</h3>` + chips(p.ent);
  if (p.plat && Object.keys(p.plat).length) h += `<h3>Gaming platforms vs ${esc(enName(cc))} average</h3>` + chips(p.plat);
  if (cl && !cl.solo) h += `<h3>Same circle</h3>` + cl.members.filter(m => m !== k).map(m => `<div class="row" data-cc="${m}"><span class="nm" style="width:auto">${esc(nameKC(m))}</span></div>`).join("");
  return h;
}
function renderStatus() {
  const st = (W && W.status) || {}, el = $("st");
  el.textContent = statusText();
  el.title = Object.entries(st.errors || {}).map(([k, v]) => `${k}: ${v}`).join("\n");
}
function renderLegend() {
  $("lgt").innerHTML = `<span class="z" style="left:0">Moon · Sun · Mars · Proxima<br>$0k</span>` + ["cn", "us"].map(cc => {
    const v = incOf(cc);
    if (!v) return "";
    const p = Math.max(0, Math.min(1, (Math.log(v) - LMIN) / (LMAX - LMIN))) * 100;
    return `<span style="left:${p}%">${esc(enName(cc))}<br>${fmtInc(v)}</span>`;
  }).join("");
}
function renderPanel() {
  renderStatus();
  const h = selCC ? (isPl(selCC) ? placeCard(selCC) : countryCard(selCC)) : selCl && R ? clusterCard(selCl) : "";
  if (!h) { selCC = null; selCl = null; }
  $("panel").innerHTML = h;
  $("panel").scrollTop = 0;
  if (layout() && mode === "flat") drawFlat();
}
$("panel").addEventListener("click", e => {
  const t = e.target.closest("[data-cc],[data-cl],[data-x]");
  if (!t) return;
  if (t.dataset.cc) select(t.dataset.cc);
  else if (t.dataset.cl) selectCluster(t.dataset.cl);
  else if (t.dataset.x !== undefined) select(null);
});

$("mode").addEventListener("click", e => {
  mode = mode === "globe" ? "flat" : "globe";
  e.target.textContent = mode === "globe" ? "Flat" : "Globe";
  gEl.style.display = mode === "globe" ? "" : "none";
  flat.style.display = mode === "flat" ? "block" : "none";
  solEl.style.display = mode === "globe" ? "" : "none";
  $("tip").style.display = "none";
  world.pauseAnimation && (mode === "flat" ? world.pauseAnimation() : world.resumeAnimation());
  syncBorders();
  if (mode === "flat") {
    if (focus === "earth") { const pv = world.pointOfView(); fv.x = mX(pv.lng); fv.y = mY(pv.lat); }
    if (!fv.init) { fv.z = Math.log2(Math.max(flat.clientWidth, 256) / 512); fv.init = true; }
    drawFlat();
  }
});
$("bd").addEventListener("click", e => {
  showBd = !showBd;
  e.target.classList.toggle("on", showBd);
  repaint();
});
/* v100：上限 20 万 → 200 万（滑块越大一枚越值钱，金币越少、越稀疏） */
const INC_LO = Math.log(2000), INC_HI = Math.log(2000000);
/* 一枚金币值多少钱 = 滑块值 × 平均每格人口 */
const coinVal = () => sets[0].inc ? refInc * flatDots().pbar : null;
const coinLabel = () => { const q = coinVal(); return q ? "1 coin = " + fmtMoney(q) : fmtInc(refInc) + " × cell"; };
function dotButtons() {
  $("pop").classList.toggle("on", showPop && dotMode === "pop");
  $("inc").classList.toggle("on", showPop && dotMode === "inc");
  $("incw").style.display = showPop && dotMode === "inc" ? "" : "none";
  $("incv").textContent = coinLabel();
  incLegend();
}
function incLegend() {
  const el = $("lgi"), on = showPop && dotMode === "inc";
  el.style.display = on ? "" : "none";
  if (on) el.innerHTML = `<div style="margin-top:6px;max-width:250px;line-height:1.4">Spending: household final consumption spending per person per year (World Bank, current US$ at market exchange rates, not PPP).<br>Spending in each country is gathered into gold coins (${coinLabel()}); places that can't fill half a coin are left out.<br>Globe: coins stack up where they gather. A stack holds ${COIN_MIN}–${COIN_CAP} coins (more where people spend more); extra coins go to the nearest free spots, so piles stay compact and empty land stays empty. At low values coins are drawn thinner so stacks stay on screen.</div>`;
}
for (const id of ["pop", "inc"]) $(id).addEventListener("click", () => {
  if (showPop && dotMode === id) showPop = false; else { showPop = true; dotMode = id; }
  dotButtons(); refreshDots();
});
$("incr").value = Math.round((Math.log(refInc) - INC_LO) / (INC_HI - INC_LO) * 1000);
let incRaf = 0;
$("incr").addEventListener("input", e => {
  const raw = Math.exp(INC_LO + (INC_HI - INC_LO) * e.target.value / 1000), st = Math.pow(10, Math.floor(Math.log10(raw)) - 1);
  refInc = Math.round(raw / st) * st;
  $("incv").textContent = coinLabel();
  incLegend();
  clearTimeout(incRaf);
  incRaf = setTimeout(refreshDots, 120);
});
dotButtons();
addEventListener("resize", () => {
  world.width(gEl.clientWidth).height(gEl.clientHeight);
  if (mode === "flat") drawFlat();
});

let lastUpdated = null, loadTimer = 0;
async function load() {
  clearTimeout(loadTimer);
  const w = await getJSON("/api/world");
  if (!w) { $("st").textContent = "Can't reach the radar"; loadTimer = setTimeout(load, 30000); return; }
  const first = !W, spOld = W && W.spend ? Object.keys(W.spend).length : 0;
  W = w; R = w.result;
  const igNew = (!IG || IG.kind !== 2) && await loadIncGrid();
  /* 消费数据后台第一次下载好（或更新了国家数）也要重算 */
  const spNew = (w.spend ? Object.keys(w.spend).length : 0) !== spOld;
  if (first || igNew || spNew) { dotIncomes(); if (dotMode === "inc") refreshDots(); dotButtons(); }
  let rgNew = false;
  /* 统一的边界数据第一次准备好时整页重新加载一次（国家轮廓要整套换掉） */
  const reload1 = () => { try { if (sessionStorage.getItem("rg2")) return false; sessionStorage.setItem("rg2", "1"); } catch { return false; } location.reload(); return true; };
  if (!TOPO && (w.regions || {}).geo_v === 2 && reload1()) return;
  if (!RG) { const rg = await getJSON("/api/regions"); if (rg && rg.units) { if (rg.v === 2 && !TOPO && reload1()) return; if (rg.v !== 2 || TOPO) { setRegions(rg); FLAT_DIRTY = true; POLYREF = null; buildBorders(); rgNew = true; } } }
  IDX = {}; NEAR = {}; UP = []; PINC = {}; CL = [];
  if (R) {
    R.order.forEach((cc, i) => IDX[cc] = i);
    CL = R.pclusters || R.clusters || [];
    for (const c of CL) c.games = c.games || [];
    if (R.places) {
      for (const [k, p] of Object.entries(R.places)) {
        NEAR[k] = new Map(p.near || []);
        if (p.units) for (const u of p.units) UP[u] = k;
      }
    } else R.order.forEach((a, i) => { NEAR[a] = new Map(R.order.map((b, j) => [b, R.sim[i][j]]).filter(([b]) => b !== a)); });
  }
  renderLegend();
  if ((R && R.updated !== lastUpdated) || rgNew) { lastUpdated = R && R.updated; if (selCC) select(selCC, selU >= 0 ? UMAP[selU] : null); else if (selCl) selectCluster(selCl); else { repaint(); renderPanel(); } }
  else renderStatus();
  loadTimer = setTimeout(load, (W.status || {}).phase === "scan" || ["fetch", "borders"].includes((W.regions || {}).phase) ? 20000 : 300000);
}
repaint();
renderLegend();
loadPF();
await load();

</script>
</body>
</html>
